<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, minimum-scale=0.1, maximum-scale=10.0, user-scalable=yes">
    <title>Dentsoft | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="auth.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background glow elements */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: #ec4899;
            filter: blur(120px);
            border-radius: 50%;
            top: 15%;
            left: 20%;
            opacity: 0.15;
            z-index: 0;
        }

        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: #3b82f6;
            filter: blur(150px);
            border-radius: 50%;
            bottom: 10%;
            right: 15%;
            opacity: 0.15;
            z-index: 0;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .brand-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 10px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.2);
            margin-bottom: 15px;
        }

        .brand-logo img {
            height: 60px;
            display: block;
        }

        .brand-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-label {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
            transition: color 0.3s;
        }

        .form-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 14px 12px 42px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }

        .form-input:focus {
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-input:focus + .input-icon {
            color: #ec4899;
        }

        /* Remember Me Row */
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            user-select: none;
        }

        .remember-label {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
        }

        .remember-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 5px;
            background: rgba(15, 23, 42, 0.6);
            cursor: pointer;
            position: relative;
            outline: none;
            transition: all 0.2s ease;
        }

        .remember-checkbox:checked {
            background: #ec4899;
            border-color: #ec4899;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
        }

        .remember-checkbox:checked::after {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: #ffffff;
            font-size: 11px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .remember-checkbox:focus {
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #ec4899 0%, #d946ef 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
            filter: brightness(1.1);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-section">
            <div class="brand-logo">
                <img src="logo.jpeg" alt="Dentsoft Logo">
            </div>
            <h1 class="brand-title">DENTSOFT</h1>
            <p class="brand-subtitle">Lab Command & Management Portal</p>
        </div>

        <div class="error-message" id="error-msg">
            <i class="fas fa-exclamation-circle"></i>
            <span id="error-text">Incorrect username or password.</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">Username / ID</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                    <i class="fas fa-lock input-icon"></i>
                </div>
            </div>

            <div class="remember-row">
                <label class="remember-label" for="remember-me">
                    <input type="checkbox" id="remember-me" class="remember-checkbox" checked>
                    <span>Remember Me on this device</span>
                </label>
            </div>

            <button type="submit" class="btn-login" id="submit-btn">
                <span>SIGN IN</span>
                <div class="spinner" id="spinner-icon"></div>
            </button>

            <div style="margin-top: 22px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 14px;">
                <p style="color: #94a3b8; font-size: 11.5px; letter-spacing: 0.5px; font-weight: 500;">
                    Developed by <span style="color: #ec4899; font-weight: 700;">AIAutomation Lab</span>
                </p>
            </div>
        </form>
    </div>

    <script>
        // Pre-fill saved username and remember state if available
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('savedUsername');
            const rememberMeState = localStorage.getItem('rememberMe');
            const usernameInput = document.getElementById('username');
            const rememberCheckbox = document.getElementById('remember-me');
            
            if (savedUser) {
                usernameInput.value = savedUser;
                const passwordInput = document.getElementById('password');
                if (passwordInput) passwordInput.focus();
            }

            if (rememberMeState === 'false') {
                rememberCheckbox.checked = false;
            } else {
                rememberCheckbox.checked = true;
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const rememberCheckbox = document.getElementById('remember-me');
            const submitBtn = document.getElementById('submit-btn');
            const spinner = document.getElementById('spinner-icon');
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');

            // Reset states
            errorMsg.style.display = 'none';
            spinner.style.display = 'block';
            submitBtn.disabled = true;

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const isRemember = rememberCheckbox.checked;

            // Make API configuration safe for both localhost and remote env
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const API = (window.location.protocol === 'file:' || isLocal) ? 'http://localhost:5000/api' : window.location.origin + '/api';

            try {
                const response = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed. Please verify credentials.');
                }

                // Clear previous session states
                sessionStorage.clear();

                // Active login token & credentials stored in sessionStorage and localStorage for multi-tab support
                if (data.token) {
                    sessionStorage.setItem('authToken', data.token);
                    localStorage.setItem('authToken', data.token);
                }
                sessionStorage.setItem('userRole', data.role);
                localStorage.setItem('userRole', data.role);
                sessionStorage.setItem('username', data.username);
                localStorage.setItem('username', data.username);

                if (isRemember) {
                    // Remember Me: Save username for quick pre-filling next time
                    localStorage.setItem('savedUsername', data.username);
                    localStorage.setItem('rememberMe', 'true');
                } else {
                    // Do NOT remember: Clear saved username
                    localStorage.removeItem('savedUsername');
                    localStorage.setItem('rememberMe', 'false');
                }

                // Redirect to dashboard
                window.location.replace('index.html');
            } catch (err) {
                console.error("Login failed:", err);
                errorText.textContent = err.message;
                errorMsg.style.display = 'flex';
                spinner.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
